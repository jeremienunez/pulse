name: Pulse portable checks

on:
  push:
    branches: [tuned/main]
  pull_request:
    branches: [tuned/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the indexed candidate with the shared CI profile
        run: node scripts/pulse-quality.mjs --profile ci
