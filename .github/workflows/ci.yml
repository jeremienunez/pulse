name: Pulse portable checks

on:
  push:
    branches: [tuned/main]
  pull_request:
    branches: [tuned/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    # CLI isolation fixtures require unprivileged user namespaces.
    # Pin a compatible hosted image instead of disabling host AppArmor policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.93.1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - name: Prepare Linux isolation required by CLI tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
          bwrap --version
          bwrap --ro-bind / / -- node --version
      - name: Prepare explicitly locked tools outside the source
        shell: bash
        run: |
          export PULSE_QUALITY_TOOLCHAIN="$RUNNER_TEMP/pulse-code-quality-tools"
          echo "PULSE_QUALITY_TOOLCHAIN=$PULSE_QUALITY_TOOLCHAIN" >> "$GITHUB_ENV"
          mkdir -p "$PULSE_QUALITY_TOOLCHAIN"
          cp scripts/code-quality/tools/package.json scripts/code-quality/tools/package-lock.json "$PULSE_QUALITY_TOOLCHAIN/"
          npm ci --prefix "$PULSE_QUALITY_TOOLCHAIN" --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['PULSE_QUALITY_TOOLCHAIN'])
          subprocess.run([sys.executable, '-m', 'venv', str(root / '.venv')], check=True)
          versions = json.loads(pathlib.Path('scripts/code-quality/toolchain.json').read_text())['python_packages']
          subprocess.run([str(root / '.venv/bin/python'), '-m', 'pip', 'install', '--disable-pip-version-check', '--no-deps', *[f'{name}=={version}' for name, version in versions.items()]], check=True)
          PY
          rustup toolchain install 1.93.1 --profile minimal --component clippy
          cargo install tokei --version 15.0.0 --locked --root "$PULSE_QUALITY_TOOLCHAIN/native"
      - name: Prepare locked messaging artifacts outside source
        shell: bash
        run: |
          export PULSE_MESSAGING_TOOLCHAIN="$RUNNER_TEMP/pulse-messaging-tools"
          export PULSE_MESSAGING_PROBE_BUILD="$RUNNER_TEMP/pulse-messaging-built"
          mkdir -p "$PULSE_MESSAGING_TOOLCHAIN" "$PULSE_MESSAGING_PROBE_BUILD"
          cp scripts/cli-messaging-tools/package.json scripts/cli-messaging-tools/package-lock.json "$PULSE_MESSAGING_TOOLCHAIN/"
          npm ci --prefix "$PULSE_MESSAGING_TOOLCHAIN" --ignore-scripts --no-audit --no-fund
          node scripts/build-cli-messaging-runtime.mjs --toolchain "$PULSE_MESSAGING_TOOLCHAIN" --out "$PULSE_MESSAGING_PROBE_BUILD"
          for entry in mcp-component channel-fixture native-feasibility codex-owner-launcher; do
            node scripts/build-cli-messaging-runtime.mjs --toolchain "$PULSE_MESSAGING_TOOLCHAIN" --out "$PULSE_MESSAGING_PROBE_BUILD" --entry "$entry"
          done
          echo "PULSE_MESSAGING_TOOLCHAIN=$PULSE_MESSAGING_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "PULSE_MESSAGING_PROBE_BUILD=$PULSE_MESSAGING_PROBE_BUILD" >> "$GITHUB_ENV"
          echo "PULSE_MESSAGING_RUNTIME_BUNDLE=$PULSE_MESSAGING_PROBE_BUILD/cli-messaging-runtime.mjs" >> "$GITHUB_ENV"
          echo "PULSE_MESSAGING_MCP_BUILD=$PULSE_MESSAGING_PROBE_BUILD/mcp-component.mjs" >> "$GITHUB_ENV"
      - name: Verify deterministic messaging and extracted distributions without accounts
        run: node --test scripts/test-cli-messaging-*.mjs scripts/test-build-cli-messaging-dist.mjs scripts/test-cli-bridge.mjs
      - name: Verify the indexed candidate with the shared CI profile
        run: node scripts/pulse-quality.mjs --profile ci
